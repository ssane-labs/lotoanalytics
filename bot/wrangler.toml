# Конфигурация Cloudflare Workers.
#
# Секреты здесь НЕ ХРАНЯТСЯ. Они задаются отдельно:
#   wrangler secret put BOT_TOKEN        — токен от BotFather
#   wrangler secret put WEBHOOK_SECRET   — подпись вебхуков Telegram
#   wrangler secret put AD_REWARD_SECRET — подпись callback рекламной сети
#   wrangler secret put ADMIN_IDS        — кому доступна команда /stats
# либо в панели Cloudflare: Workers -> ваш воркер -> Settings -> Variables ->
# Secrets. Всё, что попадает в этот файл, уходит в публичный git, значит
# секретов тут быть не может.

name = "loto-analytics-bot"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Адрес Mini App на GitHub Pages. Слэш на конце обязателен.
MINIAPP_URL = "https://ssane-labs.github.io/lotoanalytics/"

# Страница для донатов. Сам воркер её не использует — кнопка живёт в
# docs/config.js, — но переменная задана здесь, чтобы публикация не затирала
# значение в панели заглушкой.
DONATE_URL = "https://boosty.to/fabrix.com/donate"

# Идентификатор рекламного блока Adsgram (rewarded video). Пусто — кнопка
# «Смотреть ролик» в приложении не показывается, остальное работает.
# Берётся в кабинете Adsgram: Blocks -> ваш блок -> Block ID.
#
# Не секрет: он и так уезжает в браузер вместе с балансом, иначе SDK рекламы
# не знал бы, какой блок показывать.
ADSGRAM_BLOCK_ID = "48019"

# ADMIN_IDS — Telegram ID администраторов через запятую, им доступна команда
# /stats. Здесь значения НЕТ намеренно: репозиторий публичный, а личный ID
# владельца в нём никому не нужен. Задаётся в панели Cloudflare как Secret
# (Settings -> Variables and Secrets -> тип Secret), и тогда публикация его
# не затирает. Свой ID бот пришлёт на /myid.

# Хранилище кошельков: у кого сколько прокруток. Имя SUBS осталось от версии
# с подписками — переименование потребовало бы нового хранилища и переезда
# данных, а привязка в коде от имени не зависит.
#
# Идентификатор обязан быть настоящим: автопубликация падала именно из-за
# заглушки здесь. Посмотреть можно в панели: Storage & Databases -> KV,
# столбец ID рядом с именем хранилища.
#
# Он остаётся в публичном файле осознанно. Это адрес хранилища внутри
# аккаунта, а не ключ к нему: прочитать или изменить данные по одному ID
# нельзя, нужен токен API. Убрать его отсюда — значит сломать привязку KV
# при каждой автопубликации.
[[kv_namespaces]]
binding = "SUBS"
id = "80c6305090e145b5971da7ab803efe3c"
