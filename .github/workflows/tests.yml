name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# В публичном репозитории PR может открыть кто угодно. Тестам ничего писать
# не нужно, поэтому выдаём минимум явно, а не полагаемся на настройку репозитория.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Тесты математического ядра
        run: python tests/test_core.py

      - name: Пересобрать эталонные векторы
        run: python tests/make_vectors.py

      - name: Векторы не должны меняться незаметно
        run: |
          # Если модель изменили осознанно — перегенерируйте векторы и
          # закоммитьте их вместе с изменением. Молчаливый дрейф модели
          # означал бы, что опубликованные данные посчитаны по одной версии,
          # а приложение считает по другой.
          if ! git diff --quiet tests/vectors.json; then
            echo "::error::tests/vectors.json устарел. Запустите python tests/make_vectors.py и закоммитьте результат."
            git diff --stat tests/vectors.json
            exit 1
          fi

      - name: Python и JS должны считать одинаково
        run: node tests/parity.test.mjs

      - name: Подпись initData нельзя подделать
        run: node tests/initdata.test.mjs

      - name: Собранный воркер соответствует исходникам
        run: python bot/build_bundle.py --check

      - name: Версии файлов приложения проставлены
        run: python scripts/stamp_version.py --check

      # Самая короткая история — «Большое Спортлото»: сборка проверяется
      # целиком, включая обучение нейросети, но за полминуты.
      - name: Сборка данных не должна падать
        run: python scripts/build_data.py --game 5x2 --mc-samples 5000 --ai-epochs 2
