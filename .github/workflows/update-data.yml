name: Обновление данных

# Раз в сутки тянем свежие тиражи из архива Столото, переобучаем нейросеть,
# пересчитываем статистику и коммитим результат в docs/data/. GitHub Pages раздаёт папку docs/ как есть, поэтому
# отдельный деплой не нужен: коммит = публикация.

on:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC ежедневно
  workflow_dispatch:        # и кнопкой из вкладки Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install -r requirements.txt

      # Новые тиражи — из архива Столото. Если он не ответил, сборка идёт из
      # накопленного в data/: приложение продолжит работать на прошлых данных.
      - name: Собрать данные
        run: python scripts/build_data.py --fetch

      - name: Закоммитить, если что-то изменилось
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --staged --quiet; then
            echo "Изменений нет — новых тиражей не появилось."
          else
            git commit -m "Данные: обновление тиражей"
            git push
          fi
