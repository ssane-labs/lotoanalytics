name: Публикация воркера

# Избавляет от ручной вставки кода в панель Cloudflare. Каждый push, который
# трогает воркер, публикует его сам.
#
# Разовая настройка (делается один раз, потом не нужна):
#
# 1. Cloudflare -> значок профиля справа вверху -> Profile -> API Tokens
#    -> Create Token -> шаблон "Edit Cloudflare Workers" -> Continue -> Create.
#    Скопируйте показанный токен: второй раз его не покажут.
#
# 2. Узнайте Account ID: Cloudflare -> Workers & Pages, идентификатор виден в
#    адресной строке сразу после dash.cloudflare.com/
#
# 3. GitHub -> Settings -> Secrets and variables -> Actions -> New repository
#    secret, дважды:
#       CLOUDFLARE_API_TOKEN   — токен из шага 1
#       CLOUDFLARE_ACCOUNT_ID  — идентификатор из шага 2
#
# Дальше публикация идёт сама. Секреты воркера (BOT_TOKEN, WEBHOOK_SECRET) и
# привязка KV живут в Cloudflare и этим процессом не затрагиваются.

on:
  push:
    branches: [main]
    paths:
      - 'bot/worker.js'
      - 'bot/verify.js'
      - 'bot/wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Публикуем из исходников, а не из склейки: wrangler умеет импорты сам.
      # Но склейка обязана быть свежей — её вставляют вручную, если Actions
      # недоступен, и разошедшаяся копия хуже, чем её отсутствие.
      - name: Собранный файл не отстал от исходников
        run: python bot/build_bundle.py --check

      # Проверяем токен до публикации: так понятно, дело в правах доступа или
      # в самом воркере. Иначе wrangler сообщает лишь «запрос к API не удался».
      - name: Проверить токен и доступ к аккаунту
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Не заданы секреты CLOUDFLARE_API_TOKEN и/или CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

          echo "## Проверка доступа" >> "$GITHUB_STEP_SUMMARY"

          verify=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo '### Токен' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$verify" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Виден ли токену тот аккаунт, в который мы публикуем.
          acc=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          echo '### Аккаунт' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$acc" | head -c 900 >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "$verify" | grep -q '"status":"active"'             || echo "::warning::Токен не в состоянии active — проверьте права и срок действия."
          echo "$acc" | grep -q '"success":true'             || echo "::error::Токену не виден аккаунт $CLOUDFLARE_ACCOUNT_ID. Скорее всего, при создании токена не выдан доступ к этому аккаунту."

      # Вызываем wrangler напрямую, а не через готовое действие: оно прячет
      # вывод внутри сворачиваемой группы лога, и при падении наружу попадает
      # только «процесс завершился с кодом 1» — без причины. Здесь же вывод
      # дублируется в аннотации, которые видны сразу на странице прогона.
      # Публикация трижды отчиталась об успехе, а боевой адрес продолжал
      # отдавать прежний код. Печатаем, что именно видит процесс перед
      # отправкой: иначе непонятно, устарел ли checkout или сама выкатка.
      - name: Что публикуем
        run: |
          {
            echo "## Исходник перед публикацией"
            echo '```'
            echo "commit: $GITHUB_SHA"
            echo "sha256 worker.js: $(sha256sum bot/worker.js | cut -d' ' -f1)"
            echo "метка build:      $(grep -o "build: '[^']*'" bot/worker.js || echo 'НЕТ')"
            echo "пакеты прокруток:"
            sed -n '/^const PACKS/,/^};/p' bot/worker.js | sed 's/^/  /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Опубликовать воркер
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if npx --yes wrangler@3 deploy 2>&1 | tee /tmp/wrangler.log; then
            echo "Публикация прошла успешно."
            exit 0
          fi
          echo "::error::wrangler не смог опубликовать воркер, вывод в сводке прогона."
          # Аннотаций показывается не больше десяти, и строка с кодом ошибки в
          # них не помещалась. Сводка отображается целиком.
          {
            echo "## Вывод wrangler"
            echo '```'
            cat /tmp/wrangler.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -iE 'code: *[0-9]+|Authentication|permission|denied|not found' /tmp/wrangler.log             | head -n 6 | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::$line"
              done
          exit 1
